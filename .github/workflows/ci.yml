name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rails: "7.0"
            turbo: "1.5"
            ruby: "3.1"
            os: ubuntu-24.04 # no Ruby 3.1 builds for newer runner images
          - rails: "7.1"
            ruby: "3.2"
          - rails: "7.2"
            ruby: "3.3"
          - rails: "8.0"
            ruby: "3.4"
          - rails: "8.1"
            ruby: "3.4"
    name: Rails ${{ matrix.rails }} / Ruby ${{ matrix.ruby }}${{ matrix.turbo && format(' / turbo-rails {0}', matrix.turbo) || '' }}
    env:
      RAILS_VERSION: ${{ matrix.rails }}
      TURBO_RAILS_VERSION: ${{ matrix.turbo }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test
